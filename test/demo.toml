# 云档 配置文件（由向导生成，可手工编辑）
# mode 可选: timestamp=时间戳 / mirror=镜像 / archive=归档(zip快照)

[general]
backup_keep = 10   # 推送前备份保留份数（归档模式下同时是 zip 保留份数，0=不清理）
timeout_launch = 120   # 等待进程出现的超时秒数
net_wait = 10   # 网络目录不可达时的等待秒数

[[game]]
name = '阿尔法'
exe = 'C:\Windows\System32\ping.exe'
args = '-n 1 127.0.0.1'
mode = 'timestamp'
cover = 'C:\Users\HC\.zcode\workspace\c7d3d2f8-915f-4575-870f-7549bedc0c96\云档\test\cover_测试.png'
exclude = ['*.tmp', 'shadercache/']
sync = [
  { local = 'C:\Users\HC\.zcode\workspace\c7d3d2f8-915f-4575-870f-7549bedc0c96\云档\test\loc', net = 'C:\Users\HC\.zcode\workspace\c7d3d2f8-915f-4575-870f-7549bedc0c96\云档\test\net' },
]

