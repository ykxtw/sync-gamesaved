# 测试1：时间戳模式 + 完整会话（含启动 cmd/ping 模拟游戏）
[general]
backup_keep = 3
timeout_launch = 30
net_wait = 10

[[game]]
name = '测试'
exe = 'C:\Windows\System32\ping.exe'
args = '-n 3 127.0.0.1'
mode = 'timestamp'
exclude = ['*.tmp', 'shadercache/']
sync = [
  { local = '/home/z/my-project/sync-gamesaved/test\loc', net = '/home/z/my-project/sync-gamesaved/test\net' },
]
